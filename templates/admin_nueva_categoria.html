{% extends "layout.html" %}

{% block content %}

{% include 'partials/navbar.html' %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card bg-dark border-secondary shadow">

                <div class="card-header">

                    <h3 class="mb-0">

                        Nueva Categoría

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Nombre

                            </label>

                            <input

                                type="text"

                                name="nombre"

                                class="form-control"

                                maxlength="100"

                                required

                                autofocus

                            >

                        </div>

                        <div class="d-flex justify-content-end gap-2">

                            <a

                                href="{{ url_for('admin.categorias_admin') }}"

                                class="btn btn-secondary"

                            >

                                Cancelar

                            </a>

                            <button

                                type="submit"

                                class="btn btn-primary"

                            >

                                Guardar

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% include 'partials/footer.html' %}

{% endblock %}
