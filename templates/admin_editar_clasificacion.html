{% extends "layout.html" %}

{% block content %}

{% include 'partials/navbar.html' %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card bg-dark border-secondary shadow">

                <div class="card-header">

                    <h3 class="mb-0">

                        Editar Clasificación

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Nombre

                            </label>

                            <input

                                type="text"

                                name="nombre"

                                class="form-control"

                                maxlength="20"

                                value="{{ clasificacion.nombre }}"

                                required

                                autofocus

                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Descripción

                            </label>

                            <textarea

                                name="descripcion"

                                class="form-control"

                                rows="3"

                                maxlength="255"

                                required

                            >{{ clasificacion.descripcion }}</textarea>

                        </div>

                        <div class="d-flex justify-content-end gap-2">

                            <a

                                href="{{ url_for('admin.clasificaciones_admin') }}"

                                class="btn btn-secondary"

                            >

                                Cancelar

                            </a>

                            <button

                                type="submit"

                                class="btn btn-primary"

                            >

                                Actualizar

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% include 'partials/footer.html' %}

{% endblock %}
